<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/web_logo_bg.svg" />

    <title>Virtara | Digital Agency South Africa</title>
    <meta
      name="description"
      content="Virtara is a South African digital agency building conversion-focused websites, SEO and digital marketing for businesses that need measurable growth."
    />
    <link rel="canonical" href="https://virtara.co.za/" />

    <!-- Fonts are pulled from Google. Preconnect saves the DNS + TLS
         round-trips; loading the stylesheet with media="print" and flipping
         it to "all" on load keeps it off the critical path entirely. The
         fonts use display=swap, so text paints immediately in the fallback
         and reflows once Inter/Chakra Petch arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
      fetchpriority="high"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Virtara" />
    <meta property="og:title" content="Virtara | Digital Agency South Africa" />
    <meta
      property="og:description"
      content="Conversion-focused websites, SEO and digital marketing for South African businesses that need measurable growth."
    />
    <meta property="og:url" content="https://virtara.co.za/" />
    <meta property="og:image" content="https://virtara.co.za/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Virtara" />
    <meta property="og:locale" content="en_ZA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Virtara | Digital Agency South Africa" />
    <meta
      name="twitter:description"
      content="Conversion-focused websites, SEO and digital marketing for South African businesses that need measurable growth."
    />
    <meta name="twitter:image" content="https://virtara.co.za/og-image.png" />

    <meta name="theme-color" content="#050608" />
  </head>
  <body class="bg-canvas">
    <!--
      DIRECTION (impeccable) — Blue-hour console.
      THESIS: Virtara proves outcomes; the page is a quiet near-black stage and the client's real work is the product in the frame.

      STORY: hero → client workspace rising from the fold → unboxed proof → services as deliverables → three-question qualifier → Drakensberg close.
      FIRST VIEWPORT: centred display line, two actions, the workspace frame breaking the fold.
      FORM: tokens in src/design/tokens.js; rules in DESIGN.md; live book at /brand.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
